[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib
  h2zero/NimBLE-Arduino
build_flags =
  -D MISSIONLINK_VERSION=\"0.2.1\"
  ; Wio-SX1262 B2B pin mapping for the XIAO ESP32-S3 kit.
  -D ML_RADIO_PINMAP_VERIFIED=1
  -D ML_RADIO_RX_ENABLED=1
  -D ML_RADIO_SCK=7
  -D ML_RADIO_MISO=8
  -D ML_RADIO_MOSI=9
  -D ML_RADIO_CS=41
  -D ML_RADIO_DIO1=39
  -D ML_RADIO_RESET=42
  -D ML_RADIO_BUSY=40
  -D ML_RADIO_ANT_SW=38
  ; RX configuration only; transmit remains blocked by ML_RF_ENABLED=0.
  -D ML_RADIO_FREQ_MHZ=915.0
  -D ML_RADIO_BANDWIDTH_KHZ=125.0
  -D ML_RADIO_SPREADING_FACTOR=9
  -D ML_RADIO_CODING_RATE=7
  -D ML_RADIO_SYNC_WORD=0x12
  -D ML_RADIO_TX_POWER_DBM=10

[env:native]
platform = native
build_flags = -std=c++17 -I include
build_src_filter = +<packet_codec.cpp> +<mesh_router.cpp> +<mos_storage.cpp> +<mos_contact_book.cpp>
test_build_src = yes
