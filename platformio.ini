[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib@7.1.2
  h2zero/NimBLE-Arduino
build_flags =
  -D MISSIONLINK_VERSION=\"0.2.1\"
  ; Explicit V1 hardware identity: top-mounted XIAO ESP32-S3 / Wio-SX1262 B2B kit.
  -D ML_BOARD_XIAO_ESP32S3_WIO_SX1262_B2B=1
  ; Fail-closed default: do not claim a verified pin map or initialize the radio.
  ; Replace these only after the exact board/module revision and official pinout
  ; have been checked against the hardware actually being tested.
  -D ML_RADIO_PINMAP_VERIFIED=0
  -D ML_RADIO_RX_ENABLED=0
  ; ML_RF_ENABLED is independently hard-coded to 0 in missionlink_config.h.
  ; Do not add a build flag that overrides it as part of ordinary CI.

[env:native]
platform = native
build_flags = -std=c++17 -I include
build_src_filter = +<packet_codec.cpp> +<mesh_router.cpp> +<mos_storage.cpp> +<mos_contact_book.cpp> +<mos_contact_book_codec.cpp>
test_build_src = yes
